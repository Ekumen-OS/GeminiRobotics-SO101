[project]
name = "geminirobotics-so101"
version = "0.1.0"
description = "Gemini Robotics models integration with the SO-101 Robotic Arm"
readme = "README.md"
license = "Apache-2.0"
authors = [
  { name = "Ekumen" },
  { name = "Juan Esteban Camacho", email = "juanes.camacho@ekumenlabs.com"}
]
keywords = ["robotics", "gemini", "so-101", "lerobot", "mujoco", "vla", "physical-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13.7"
dependencies = [
  "numpy>=2.4.6",
  "opencv-python>=5.0.0.93",
  "scipy>=1.11.0",
  "google-genai>=2.9.0",
  "python-dotenv>=1.0.0",
  "mujoco>=3.2.0",
  "pyobjc-framework-avfoundation>=12.2.1; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/Ekumen-OS/GeminiRobotics-SO101"
Issues = "https://github.com/Ekumen-OS/GeminiRobotics-SO101/issues"

[project.optional-dependencies]
hw = [
  "lerobot[feetech]",
]
ui = [
  "gradio>=6.22.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=4.0.0",
    "mypy>=1.10.0",
    "import-linter>=2.15",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D100", "D104"]
pydocstyle.convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: physics-heavy or long tests (run with `uv run pytest -m slow`)"]
# Slow tests are excluded by default; select them explicitly with `-m slow`.
addopts = "-m 'not slow'"

[tool.mypy]
python_version = "3.13"
# Single source of truth for the type-checked scope (hook and docs both use bare `mypy`).
files = [
  "robot",
  "simulation",
  "vision",
  "agent",
  "ui",
  "tools",
  "main.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true

[tool.importlinter]
root_packages = ["robot", "simulation", "vision", "agent", "ui", "tools"]

[[tool.importlinter.contracts]]
name = "Architecture Layer Contract"
type = "layers"
layers = [
    "ui",
    "agent",
    "vision",
    "simulation",
    "robot",
]

[[tool.importlinter.contracts]]
name = "Operator Tools Isolation Contract"
type = "forbidden"
source_modules = [
    "robot",
    "simulation",
    "vision",
    "agent",
    "ui",
]
forbidden_modules = [
    "tools",
]

