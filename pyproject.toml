[project]
name = "geminirobotics-so101"
version = "0.1.0"
description = "Gemini Robotics models integration with the SO-101 Robotic Arm"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "lerobot",
  "lerobot[feetech]",
  "numpy>=2.4.6",
  "ikpy>=3.4.2",
  "roboticstoolbox-python>=1.3.0",
  "spatialmath-python>=1.1.16",
  "matplotlib>=3.11.0",
  "ipykernel>=7.3.0",
  "mwparserfromhell>=0.7.2",
  "mujoco>=3.2.0",
  "gymnasium>=0.29.0",
  "scipy>=1.11.0",
  "pyyaml>=6.0",
  "mujoco-warp>=0.1.0",
  "warp-lang>=1.0.0",
  "gradio>=6.22.0",
  "opencv-python>=5.0.0.93",
  "pyobjc-framework-avfoundation>=12.2.1; sys_platform == 'darwin'",
  "google-genai>=2.9.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=4.0.0",
    "mypy>=1.10.0",
    "import-linter>=2.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D100", "D104"]
pydocstyle.convention = "google"

[tool.setuptools.packages.find]
include = ["simulation*", "robot*", "ui*", "agent*", "vision*", "tools*"]

[tool.setuptools.package-data]
"agent" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
# Single source of truth for the type-checked scope (hook and docs both use bare `mypy`).
# Start permissive: add modules here as they get annotated.
files = [
  "robot/contracts.py",
  "robot/grasp.py",
  "agent/contracts.py",
  "robot/perception.py",
  "agent/tools.py",
  "agent/response_assembler.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true

[tool.importlinter]
root_packages = ["robot", "simulation", "vision", "agent", "ui", "tools"]

[[tool.importlinter.contracts]]
name = "Architecture Layer Contract"
type = "layers"
layers = [
    "ui",
    "agent",
    "vision",
    "simulation",
    "robot",
]

[[tool.importlinter.contracts]]
name = "Operator Tools Isolation Contract"
type = "forbidden"
source_modules = [
    "robot",
    "simulation",
    "vision",
    "agent",
    "ui",
]
forbidden_modules = [
    "tools",
]

