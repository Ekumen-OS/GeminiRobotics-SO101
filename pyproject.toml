[project]
name = "geminirobotics-so101"
version = "0.1.0"
description = "Gemini Robotics models integration with the SO-101 Robotic Arm"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "lerobot",
  "lerobot[feetech]",
  "numpy>=2.4.6",
  "ikpy>=3.4.2",
  "roboticstoolbox-python>=1.3.0",
  "spatialmath-python>=1.1.16",
  "matplotlib>=3.11.0",
  "ipykernel>=7.3.0",
  "mwparserfromhell>=0.7.2",
  "mujoco>=3.2.0",
  "gymnasium>=0.29.0",
  "scipy>=1.11.0",
  "pyyaml>=6.0",
  "mujoco-warp>=0.1.0",
  "warp-lang>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D100", "D104"]
pydocstyle.convention = "google"

[tool.setuptools.packages.find]
include = ["simulation*", "robot*"]

